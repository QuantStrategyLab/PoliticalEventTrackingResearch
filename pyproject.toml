[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "political-event-tracking-research"
version = "0.1.0"
description = "Research-only political event and public disclosure tracking for US equities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
petr-build-tracker = "political_event_tracking_research.tracker:main"
petr-event-study = "political_event_tracking_research.event_study:main"
petr-import-official-events = "political_event_tracking_research.official_event_import:main"
petr-import-source-events = "political_event_tracking_research.official_event_import:main"
petr-extract-source-mentions = "political_event_tracking_research.source_mention_extract:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
