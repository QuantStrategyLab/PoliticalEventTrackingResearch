name: X Recent Search Pipeline

on:
  workflow_dispatch:
    inputs:
      queries_path:
        description: "X recent-search query config CSV path."
        required: false
        default: "examples/x_queries.example.csv"
        type: string
      aliases_path:
        description: "Symbol alias CSV path."
        required: false
        default: "examples/symbol_aliases.example.csv"
        type: string
      max_results:
        description: "X API max_results per query."
        required: false
        default: "10"
        type: string

jobs:
  build-x-source-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Fetch X recent search and extract mentions
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          QUERIES_PATH: ${{ github.event.inputs.queries_path || 'examples/x_queries.example.csv' }}
          ALIASES_PATH: ${{ github.event.inputs.aliases_path || 'examples/symbol_aliases.example.csv' }}
          MAX_RESULTS: ${{ github.event.inputs.max_results || '10' }}
        run: |
          set -euo pipefail
          if [ -z "${X_BEARER_TOKEN:-}" ]; then
            echo "X_BEARER_TOKEN secret is required for this manual workflow." >&2
            exit 1
          fi
          mkdir -p data/output/x_recent_search_pipeline
          python scripts/fetch_x_recent_search.py \
            --queries "${QUERIES_PATH}" \
            --output data/output/x_recent_search_pipeline/source_items.csv \
            --max-results "${MAX_RESULTS}" \
            --max-pages 1
          python scripts/extract_source_mentions.py \
            --raw-items data/output/x_recent_search_pipeline/source_items.csv \
            --aliases "${ALIASES_PATH}" \
            --output data/output/x_recent_search_pipeline/source_events.csv
      - name: Upload X source artifact
        uses: actions/upload-artifact@v7
        with:
          name: x-recent-search-pipeline
          path: data/output/x_recent_search_pipeline/
          if-no-files-found: error

