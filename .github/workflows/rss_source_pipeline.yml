name: RSS Source Pipeline

on:
  workflow_dispatch:
    inputs:
      identity_only:
        description: "Verify the configured publisher identity only; no collection, data changes, or PR. Main only."
        required: false
        default: false
        type: boolean
      feeds_path:
        description: "RSS feed config CSV path."
        required: false
        default: "config/free_rss_feeds.csv"
        type: string
      aliases_path:
        description: "Symbol alias CSV path."
        required: false
        default: "config/core_us_equity_aliases.csv"
        type: string
      watchlist_path:
        description: "Watchlist CSV path."
        required: false
        default: "data/live/political_watchlist.csv"
        type: string
      max_items_per_feed:
        description: "Maximum feed items per configured RSS/Atom feed."
        required: false
        default: "50"
        type: string
      commit_outputs:
        description: "Commit generated live CSV outputs back to data/live."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "15 12 * * 6"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-rss-source-events:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Manual diagnostic only. Normal generation and publication behavior is unchanged.
      - name: Check trusted publisher identity context
        id: publisher_identity_preflight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.identity_only }}
        env:
          RESEARCH_PUBLISHER_APP_ID: ${{ vars.RESEARCH_PUBLISHER_APP_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          expected_repository = "QuantStrategyLab/PoliticalEventTrackingResearch"
          expected_workflow_ref = expected_repository + "/.github/workflows/rss_source_pipeline.yml@refs/heads/main"
          app_id_matches = os.environ.get("RESEARCH_PUBLISHER_APP_ID") == "5214420"
          repository_id = os.environ.get("GITHUB_REPOSITORY_ID", "")
          context_matches = (
              os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
              and os.environ.get("GITHUB_REF") == "refs/heads/main"
              and os.environ.get("GITHUB_REPOSITORY") == expected_repository
              and os.environ.get("GITHUB_WORKFLOW_REF") == expected_workflow_ref
              and repository_id.isascii() and repository_id.isdecimal()
              and int(repository_id) > 0
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"app_id_matches={str(app_id_matches).lower()}\n")
          if not (app_id_matches and context_matches):
              print("PUBLISHER_IDENTITY_PREFLIGHT_FAILED")
              raise SystemExit(1)
          print("PUBLISHER_IDENTITY_PREFLIGHT_OK")
          PY
      - name: Create single-repository publisher identity token
        id: publisher_identity_token
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.identity_only }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RESEARCH_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.RESEARCH_PUBLISHER_APP_PRIVATE_KEY }}
          owner: QuantStrategyLab
          repositories: PoliticalEventTrackingResearch
          permission-contents: write
          permission-pull-requests: write
      - name: Verify publisher installation and repository scope
        id: publisher_identity_verify
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.identity_only }}
        env:
          RESEARCH_PUBLISHER_INSTALLATION_ID: ${{ steps.publisher_identity_token.outputs.installation-id }}
          RESEARCH_PUBLISHER_TOKEN: ${{ steps.publisher_identity_token.outputs.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          installation_matches = os.environ.get("RESEARCH_PUBLISHER_INSTALLATION_ID") == "168603414"
          scope_matches = False
          verified = False
          try:
              token = os.environ.get("RESEARCH_PUBLISHER_TOKEN", "")
              if installation_matches and token:
                  request = urllib.request.Request(
                      "https://api.github.com/installation/repositories?per_page=100",
                      headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"},
                      method="GET",
                  )
                  with urllib.request.build_opener(NoRedirect()).open(request, timeout=20) as response:
                      raw = response.read(1024 * 1024 + 1)
                      if response.status == 200 and not response.headers.get("Link") and len(raw) <= 1024 * 1024:
                          payload = json.loads(raw)
                          if type(payload) is dict and type(payload.get("total_count")) is int and payload["total_count"] == 1:
                              repositories = payload.get("repositories")
                              if type(repositories) is list and len(repositories) == 1 and type(repositories[0]) is dict:
                                  repository = repositories[0]
                                  scope_matches = (
                                      repository.get("full_name") == "QuantStrategyLab/PoliticalEventTrackingResearch"
                                      and type(repository.get("id")) is int
                                      and repository["id"] == int(os.environ["GITHUB_REPOSITORY_ID"])
                                  )
                  verified = installation_matches and scope_matches
          except Exception:
              # No API payload, exception text, request headers, token or JWT is logged.
              verified = False
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key, value in (
                  ("installation_matches", installation_matches),
                  ("single_repo_scope_matches", scope_matches),
                  ("identity_verified", verified),
              ):
                  output.write(f"{key}={str(value).lower()}\n")
          if not verified:
              print("PUBLISHER_IDENTITY_VERIFICATION_FAILED")
              raise SystemExit(1)
          print("PUBLISHER_IDENTITY_VERIFIED")
          PY
      - name: Report publisher identity-only result
        id: publisher_identity_summary
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.identity_only }}
        env:
          APP_ID_MATCHES: ${{ steps.publisher_identity_preflight.outputs.app_id_matches }}
          INSTALLATION_MATCHES: ${{ steps.publisher_identity_verify.outputs.installation_matches }}
          SINGLE_REPO_SCOPE_MATCHES: ${{ steps.publisher_identity_verify.outputs.single_repo_scope_matches }}
          IDENTITY_VERIFIED: ${{ steps.publisher_identity_verify.outputs.identity_verified }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = {
              "app_id_matches": os.environ.get("APP_ID_MATCHES") == "true",
              "installation_matches": os.environ.get("INSTALLATION_MATCHES") == "true",
              "single_repo_scope_matches": os.environ.get("SINGLE_REPO_SCOPE_MATCHES") == "true",
              "identity_verified": os.environ.get("IDENTITY_VERIFIED") == "true",
              "published": False,
          }
          serialized = json.dumps(result, sort_keys=True)
          print(serialized)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              output.write("Publisher identity-only result (no data published):\n" + serialized + "\n")
          PY
      - uses: actions/checkout@v6
        if: ${{ !inputs.identity_only }}
      - uses: actions/setup-python@v6
        if: ${{ !inputs.identity_only }}
        with:
          python-version: "3.11"
      - name: Install package
        if: ${{ !inputs.identity_only }}
        run: python -m pip install -e .
      - name: Fetch RSS sources and extract mentions
        if: ${{ !inputs.identity_only }}
        env:
          FEEDS_PATH: ${{ github.event.inputs.feeds_path || 'config/free_rss_feeds.csv' }}
          ALIASES_PATH: ${{ github.event.inputs.aliases_path || 'config/core_us_equity_aliases.csv' }}
          WATCHLIST_PATH: ${{ github.event.inputs.watchlist_path || 'data/live/political_watchlist.csv' }}
          MAX_ITEMS_PER_FEED: ${{ github.event.inputs.max_items_per_feed || '50' }}
        run: |
          set -euo pipefail
          mkdir -p data/output/rss_source_pipeline
          python scripts/fetch_rss_sources.py \
            --feeds "${FEEDS_PATH}" \
            --output data/output/rss_source_pipeline/source_items.csv \
            --max-items-per-feed "${MAX_ITEMS_PER_FEED}" \
            --continue-on-feed-error \
            --status-output data/output/rss_source_pipeline/source_fetch_status.json
          python scripts/extract_source_mentions.py \
            --raw-items data/output/rss_source_pipeline/source_items.csv \
            --aliases "${ALIASES_PATH}" \
            --output data/output/rss_source_pipeline/source_events.csv
          python scripts/build_tracker.py \
            --watchlist "${WATCHLIST_PATH}" \
            --events data/output/rss_source_pipeline/source_events.csv \
            --output data/output/rss_source_pipeline/source_tracker.csv
      - name: Stage live CSV outputs for protected publication
        if: ${{ !inputs.identity_only }}
        env:
          COMMIT_OUTPUTS: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.commit_outputs || 'false' }}
        run: |
          set -euo pipefail
          if [ "${COMMIT_OUTPUTS}" != "true" ]; then
            echo "Live output commit disabled."
            exit 0
          fi
          mkdir -p data/live
          cp data/output/rss_source_pipeline/source_items.csv data/live/source_items.csv
          cp data/output/rss_source_pipeline/source_events.csv data/live/source_events.csv
          cp data/output/rss_source_pipeline/source_events.csv data/live/political_events.csv
          cp data/output/rss_source_pipeline/source_tracker.csv data/live/source_tracker.csv
          cp data/output/rss_source_pipeline/source_fetch_status.json data/live/source_fetch_status.json
          python scripts/write_live_manifest.py \
            --base-dir . \
            --output data/live/source_manifest.json \
            data/live/source_fetch_status.json \
            data/live/source_items.csv \
            data/live/source_events.csv \
            data/live/political_events.csv \
            data/live/source_tracker.csv
          git add data/live/source_items.csv data/live/source_events.csv data/live/political_events.csv data/live/source_tracker.csv data/live/source_fetch_status.json data/live/source_manifest.json
      - name: Create human-review publication handoff
        if: ${{ !inputs.identity_only }}
        run: |
          python scripts/publish_live_outputs_pr.py \
            --branch automation/live-rss-source-events \
            --title "Update generated live RSS source events" \
            --body "Automated research-data update. Generated files are reviewed through the normal protected-branch CI path; this workflow never pushes to main directly." \
            --commit-message "Update generated live RSS source events" \
            --handoff-dir data/output/rss_source_pipeline
      - name: Upload RSS source artifact
        if: ${{ always() && !inputs.identity_only }}
        uses: actions/upload-artifact@v7
        with:
          name: rss-source-pipeline
          path: data/output/rss_source_pipeline/
          if-no-files-found: error
