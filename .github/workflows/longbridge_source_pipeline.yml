name: Longbridge Source Pipeline

on:
  workflow_dispatch:
    inputs:
      topics_json_path:
        description: "Longbridge topic list/detail JSON path."
        required: false
        default: "examples/longbridge_topics.example.json"
        type: string
      author_allowlist_path:
        description: "Optional followed-author allowlist CSV path."
        required: false
        default: "examples/longbridge_followed_authors.example.csv"
        type: string
      aliases_path:
        description: "Symbol alias CSV path."
        required: false
        default: "examples/symbol_aliases.example.csv"
        type: string
      watchlist_path:
        description: "Watchlist CSV path."
        required: false
        default: "examples/political_watchlist.example.csv"
        type: string
      min_likes:
        description: "Minimum likes for a topic to pass."
        required: false
        default: "0"
        type: string

jobs:
  build-longbridge-source-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Import Longbridge topics and extract mentions
        env:
          TOPICS_JSON_PATH: ${{ github.event.inputs.topics_json_path || 'examples/longbridge_topics.example.json' }}
          AUTHOR_ALLOWLIST_PATH: ${{ github.event.inputs.author_allowlist_path || 'examples/longbridge_followed_authors.example.csv' }}
          ALIASES_PATH: ${{ github.event.inputs.aliases_path || 'examples/symbol_aliases.example.csv' }}
          WATCHLIST_PATH: ${{ github.event.inputs.watchlist_path || 'examples/political_watchlist.example.csv' }}
          MIN_LIKES: ${{ github.event.inputs.min_likes || '0' }}
        run: |
          set -euo pipefail
          mkdir -p data/output/longbridge_source_pipeline
          python scripts/import_longbridge_topics.py \
            --input "${TOPICS_JSON_PATH}" \
            --author-allowlist "${AUTHOR_ALLOWLIST_PATH}" \
            --min-likes "${MIN_LIKES}" \
            --output data/output/longbridge_source_pipeline/source_items.csv
          python scripts/extract_source_mentions.py \
            --raw-items data/output/longbridge_source_pipeline/source_items.csv \
            --aliases "${ALIASES_PATH}" \
            --output data/output/longbridge_source_pipeline/source_events.csv
          python scripts/build_tracker.py \
            --watchlist "${WATCHLIST_PATH}" \
            --events data/output/longbridge_source_pipeline/source_events.csv \
            --output data/output/longbridge_source_pipeline/source_tracker.csv
      - name: Upload Longbridge source artifact
        uses: actions/upload-artifact@v7
        with:
          name: longbridge-source-pipeline
          path: data/output/longbridge_source_pipeline/
          if-no-files-found: error
